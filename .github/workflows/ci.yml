name: CI

on:
  push:
  pull_request:

jobs:
  make:
    # Job name doubles as the status-check context required by the
    # "PR Required" ruleset — keep it in sync if you rename it.
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make
